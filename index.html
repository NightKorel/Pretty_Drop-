<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>推幣機</title>
  <link rel="stylesheet" href="style.css?v=0.0.6">
</head>
<body>
  <div id="hud">
    <div class="title">推幣機 <span class="ver">v0.0.6</span></div>
    <div class="money">
      <div class="box"><span class="label">手上</span><span id="wallet">0</span><span class="unit">枚</span></div>
      <div class="box"><span class="label">贏回</span><span id="won">0</span><span class="unit">枚</span></div>
      <div class="box lost"><span class="label">被吃掉</span><span id="lost">0</span><span class="unit">枚</span></div>
    </div>
    <button id="settingsBtn" type="button">設定</button>
    <div id="refill" class="refill"></div>
    <div id="settings">
      <div class="row">畫質</div>
      <div class="row">
        <button type="button" data-q="high">高</button>
        <button type="button" data-q="mid">中</button>
        <button type="button" data-q="low">低</button>
      </div>
      <div class="note">高：全部效果<br>中：關陰影<br>低：關陰影、反射、幣面圖案</div>
    </div>
  </div>
  <div id="hint">點檯面投幣，按住可以連投</div>
  <div id="loading">機台準備中……</div>
  <canvas id="view"></canvas>
  <script type="module" src="app.js?v=0.0.6"></script>
</body>
</html>
