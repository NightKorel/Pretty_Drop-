<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>推幣機</title>
  <link rel="stylesheet" href="style.css?v=0.0.2">
</head>
<body>
  <div id="hud">
    <div class="title">推幣機 <span class="ver">v0.0.2</span></div>
    <div class="money">
      <div class="box"><span class="label">手上</span><span id="wallet">0</span><span class="unit">枚</span></div>
      <div class="box"><span class="label">贏回</span><span id="won">0</span><span class="unit">枚</span></div>
      <div class="box lost"><span class="label">被吃掉</span><span id="lost">0</span><span class="unit">枚</span></div>
    </div>
    <div id="refill" class="refill"></div>
  </div>
  <div id="hint">點檯面投幣，按住可以連投</div>
  <div id="loading">機台準備中……</div>
  <canvas id="view"></canvas>
  <script type="module" src="app.js?v=0.0.2"></script>
</body>
</html>
